<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="clinicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FAF8"/>
      <stop offset="100%" stop-color="#DCF5F0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#clinicBg)"/>
  
  <!-- Clinic Room Blueprint / Outline Aesthetic -->
  <g stroke="#0D9488" stroke-width="2" fill="none" opacity="0.4">
    <!-- Floor line -->
    <line x1="50" y1="420" x2="750" y2="420" stroke-width="3"/>
    <!-- Window -->
    <rect x="80" y="80" width="220" height="240" rx="8"/>
    <line x1="190" y1="80" x2="190" y2="320"/>
    <line x1="80" y1="200" x2="300" y2="200"/>
    <!-- Dental Chair silhouette outline -->
    <path d="M 420,380 L 460,340 L 520,340 L 560,300 L 620,310 L 640,360 L 580,380 Z"/>
    <circle cx="630" cy="285" r="18"/>
    <path d="M 480,420 L 480,340"/>
    <path d="M 540,420 L 540,340"/>
    <!-- Overhead light arm -->
    <path d="M 370,120 L 450,150 L 500,220"/>
    <ellipse cx="500" cy="225" rx="30" ry="12"/>
  </g>

  <!-- Center Card -->
  <g transform="translate(400, 250)">
    <rect x="-240" y="-85" width="480" height="170" rx="16" fill="#FFFFFF" stroke="#00A896" stroke-width="2" filter="drop-shadow(0 8px 24px rgba(0, 168, 150, 0.12))"/>
    <circle cx="0" cy="-30" r="30" fill="#E6F7F5"/>
    <!-- Camera Icon -->
    <path d="M -12,-25 h 24 v 18 h -24 z M -5,-25 l 3,-5 h 4 l 3,5 z" fill="none" stroke="#00A896" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-16" r="4" fill="none" stroke="#00A896" stroke-width="2"/>
    
    <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0F766E" text-anchor="middle">
      Clinic Interior / Operatory Photo Space
    </text>
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">
      Oracare Dental Clinic • Modern Sterilized Environment
    </text>
    <text x="0" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#0D9488" text-anchor="middle">
      Drop your clinic photo as "clinic-operatory.jpg"
    </text>
  </g>
</svg>
