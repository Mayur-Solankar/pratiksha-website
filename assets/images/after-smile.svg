<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAfter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FAF8"/>
      <stop offset="100%" stop-color="#E6F7F5"/>
    </linearGradient>
    <linearGradient id="pearlWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgAfter)"/>
  
  <!-- Subtle mouth backdrop -->
  <ellipse cx="300" cy="205" rx="195" ry="110" fill="#0D9488" opacity="0.1"/>
  <ellipse cx="300" cy="205" rx="180" ry="85" fill="#3B0713" opacity="0.88"/>

  <!-- Teeth diagram after: Perfectly aligned, radiant pearl white, healthy pink gums -->
  <g transform="translate(300, 185)">
    <!-- Upper Healthy Gums -->
    <path d="M -170,-35 Q 0,-65 170,-35 C 170,-35 150,-18 0,-18 C -150,-18 -170,-35 -170,-35 Z" fill="#F472B6"/>

    <!-- Sparkling aligned teeth -->
    <rect x="-135" y="-18" width="28" height="66" rx="6" fill="url(#pearlWhite)" stroke="#0D9488" stroke-width="1.2"/>
    <rect x="-103" y="-18" width="30" height="72" rx="6" fill="url(#pearlWhite)" stroke="#0D9488" stroke-width="1.2"/>
    <rect x="-69" y="-18" width="34" height="82" rx="7" fill="url(#pearlWhite)" stroke="#0D9488" stroke-width="1.2"/>
    
    <!-- Central Incisors - perfectly symmetrical and bright -->
    <rect x="-31" y="-18" width="36" height="90" rx="8" fill="url(#pearlWhite)" stroke="#0D9488" stroke-width="1.2"/>
    <rect x="9" y="-18" width="36" height="90" rx="8" fill="url(#pearlWhite)" stroke="#0D9488" stroke-width="1.2"/>
    
    <rect x="49" y="-18" width="34" height="82" rx="7" fill="url(#pearlWhite)" stroke="#0D9488" stroke-width="1.2"/>
    <rect x="87" y="-18" width="30" height="72" rx="6" fill="url(#pearlWhite)" stroke="#0D9488" stroke-width="1.2"/>
    <rect x="121" y="-18" width="28" height="66" rx="6" fill="url(#pearlWhite)" stroke="#0D9488" stroke-width="1.2"/>

    <!-- Dental Whitening Sparkles -->
    <path d="M -18,12 Q -18,24 -8,24 Q -18,24 -18,36 Q -18,24 -28,24 Q -18,24 -18,12 Z" fill="#2DD4BF"/>
    <circle cx="-18" cy="24" r="2" fill="#FFFFFF"/>

    <path d="M 38,18 Q 38,28 46,28 Q 38,28 38,38 Q 38,28 30,28 Q 38,28 38,18 Z" fill="#00A896"/>
    <circle cx="38" cy="28" r="1.5" fill="#FFFFFF"/>

    <!-- Lower Lip -->
    <path d="M -175,76 Q 0,126 175,76 Q 0,154 -175,76 Z" fill="#FB7185"/>
  </g>
</svg>
